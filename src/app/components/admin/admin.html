<div class="admin-container">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Admin Panel - Time Slot Management</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div *ngIf="!currentUser || !currentUser.is_admin" class="warning">
            <p>You need to be logged in as an admin to access this panel.</p>
          </div>

          <div *ngIf="currentUser && currentUser.is_admin">
            <button mat-raised-button color="primary" (click)="openCreateSlotDialog()">
              <mat-icon>add</mat-icon> Add Time Slot
            </button>

            <div class="table-container">
              <table mat-table [dataSource]="timeSlots" class="mat-elevation-z2">
                <ng-container matColumnDef="category">
                  <th mat-header-cell *matHeaderCellDef>Category</th>
                  <td mat-cell *matCellDef="let slot">{{ slot.category }}</td>
                </ng-container>

                <ng-container matColumnDef="title">
                  <th mat-header-cell *matHeaderCellDef>Title</th>
                  <td mat-cell *matCellDef="let slot">{{ slot.title }}</td>
                </ng-container>

                <ng-container matColumnDef="start_time">
                  <th mat-header-cell *matHeaderCellDef>Start Time</th>
                  <td mat-cell *matCellDef="let slot">{{ formatDateTime(slot.start_time) }}</td>
                </ng-container>

                <ng-container matColumnDef="end_time">
                  <th mat-header-cell *matHeaderCellDef>End Time</th>
                  <td mat-cell *matCellDef="let slot">{{ formatDateTime(slot.end_time) }}</td>
                </ng-container>

                <ng-container matColumnDef="booking">
                  <th mat-header-cell *matHeaderCellDef>Booked By</th>
                  <td mat-cell *matCellDef="let slot">
                    <span *ngIf="slot.booking">{{ slot.booking.username }}</span>
                    <span *ngIf="!slot.booking" class="available">Available</span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef>Actions</th>
                  <td mat-cell *matCellDef="let slot">
                    <button mat-icon-button color="warn" (click)="deleteSlot(slot)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
</div>
